<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>강남언니 TOP 병원 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    line-height: 1.6;
    padding: 24px 16px;
  }
  .container { max-width: 1480px; margin: 0 auto; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #FF7A45 0%, #FF5A1F 50%, #E63946 100%);
    color: #fff;
    padding: 32px 36px;
    border-radius: 20px;
    margin-bottom: 18px;
    box-shadow: 0 8px 32px rgba(255, 90, 31, 0.25);
    position: relative;
  }
  header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
  header .subtitle { font-size: 13px; opacity: 0.9; margin-bottom: 14px; }
  header .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  header .badge {
    background: rgba(255,255,255,0.2);
    padding: 5px 12px;
    border-radius: 100px;
    font-size: 11.5px;
    font-weight: 500;
  }
  .header-actions {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .mode-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 10px;
    border-radius: 10px;
  }
  .mode-toggle .label {
    font-size: 11.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.3);
    border-radius: 22px;
    transition: 0.3s;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.3s;
  }
  input:checked + .slider { background: #fbbf24; }
  input:checked + .slider:before { transform: translateX(22px); }
  .mode-label {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    min-width: 48px;
  }
  .header-download-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .header-download-btn:hover { background: rgba(255,255,255,0.25); }
  .header-download-btn svg { width: 13px; height: 13px; }

  /* CONTROL PANEL */
  .control-panel {
    background: #fff;
    border-radius: 16px;
    padding: 18px 24px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .control-row + .control-row {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f1f3;
  }
  .selector-label {
    font-size: 12.5px;
    color: #6b7280;
    font-weight: 600;
    margin-right: 6px;
  }

  /* PRESET BUTTONS */
  .preset-buttons {
    display: flex;
    gap: 4px;
    background: #f3f4f6;
    padding: 4px;
    border-radius: 10px;
    flex-wrap: wrap;
  }
  .preset-btn {
    background: transparent;
    border: none;
    padding: 7px 14px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .preset-btn:hover { color: #111; }
  .preset-btn.active {
    background: linear-gradient(135deg, #FF7A45, #FF5A1F);
    color: #fff;
    box-shadow: 0 2px 6px rgba(255, 90, 31, 0.3);
  }

  /* CUSTOM RANGE */
  .custom-range {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #4b5563;
  }
  .month-select {
    border: 1px solid #e5e7eb;
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12px;
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    color: #111;
    font-weight: 600;
  }
  .month-select:focus { outline: 2px solid #FF5A1F; outline-offset: -1px; }
  .compare-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #4b5563;
    cursor: pointer;
  }
  .period-display {
    background: #fff7ed;
    color: #9a3412;
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid #fed7aa;
  }

  /* SEARCH */
  .search-wrapper { flex: 1; min-width: 280px; position: relative; }
  .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    background: #f9fafb;
    border: 1.5px solid #e5e7eb;
    border-radius: 9px;
    padding: 0 12px;
  }
  .search-input-wrap:focus-within {
    border-color: #FF5A1F;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(255, 90, 31, 0.1);
  }
  .search-icon { width: 15px; height: 15px; color: #9ca3af; flex-shrink: 0; }
  #hospitalSearch {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px;
    font-size: 12.5px;
    outline: none;
    font-family: inherit;
  }
  .autocomplete-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 9px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    max-height: 240px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }
  .autocomplete-dropdown.show { display: block; }
  .autocomplete-item {
    padding: 9px 14px;
    font-size: 12.5px;
    cursor: pointer;
    border-bottom: 1px solid #f5f6f8;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .autocomplete-item:hover { background: #f0f9ff; }
  .autocomplete-item.selected { background: #ecfeff; color: #0e7490; font-weight: 600; }
  .autocomplete-item .check { width: 13px; height: 13px; color: #0EA5E9; }

  .selected-chips {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center; flex: 1;
  }
  .chips-label { font-size: 11.5px; color: #6b7280; font-weight: 600; margin-right: 4px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(135deg, #FF7A45, #FF5A1F);
    color: #fff;
    padding: 4px 6px 4px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
  }
  .chip-remove {
    background: rgba(255,255,255,0.25);
    border: none;
    color: #fff;
    width: 16px; height: 16px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    padding: 0;
    line-height: 1;
  }
  .chip-remove:hover { background: rgba(255,255,255,0.4); }
  .clear-all-btn {
    background: transparent;
    border: 1px solid #e5e7eb;
    color: #6b7280;
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .clear-all-btn:hover { background: #fef2f2; color: #dc2626; border-color: #fca5a5; }
  .chips-empty { font-size: 11.5px; color: #9ca3af; font-style: italic; }

  /* COUNTRY FAVORITES */
  .country-toggles {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .country-toggle {
    background: #f3f4f6;
    border: 1.5px solid transparent;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .country-toggle:hover { background: #e5e7eb; }
  .country-toggle.active {
    background: linear-gradient(135deg, #FF7A45, #FF5A1F);
    color: #fff;
    border-color: transparent;
  }

  /* COUNTRIES GRID */
  .countries-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  .countries-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
  .countries-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .countries-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .countries-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .countries-grid.cols-1 { grid-template-columns: 1fr; }

  .country-card {
    background: #fff;
    border-radius: 14px;
    padding: 16px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .country-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 2px solid #f0f1f3;
    flex-wrap: wrap;
  }
  .country-flag { font-size: 22px; }
  .country-name { font-size: 15px; font-weight: 700; color: #111; }
  .country-total {
    margin-left: auto;
    font-size: 11px;
    color: #6b7280;
    font-weight: 600;
    text-align: right;
  }
  .country-total .total-num { color: #111; font-weight: 700; }
  .country-total .total-change { font-size: 10.5px; margin-left: 4px; }
  .country-total .up { color: #059669; }
  .country-total .down { color: #dc2626; }
  .match-badge {
    background: #fef3c7;
    color: #d97706;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 100px;
  }
  .ranking-list { display: flex; flex-direction: column; gap: 4px; }
  .rank-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 7px;
    border-radius: 7px;
    font-size: 12px;
    background: #fafbfc;
    border: 1.5px solid transparent;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .rank-item:hover { background: #f0f9ff; }
  .rank-item.highlighted {
    background: linear-gradient(135deg, #fef3c7, #fed7aa);
    border-color: #f59e0b;
  }
  .rank-item.highlighted .rank-name { color: #92400e; font-weight: 700; }
  .ranking-list.has-filter .rank-item:not(.highlighted) { opacity: 0.3; }
  .rank-num {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 5px;
    background: #f3f4f6;
    color: #6b7280;
    font-size: 10.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rank-num.top3 {
    background: linear-gradient(135deg, #FF7A45, #FF5A1F);
    color: #fff;
  }
  .rank-item.highlighted .rank-num { background: #f59e0b; color: #fff; }
  .rank-name {
    flex: 1;
    font-size: 11.5px;
    font-weight: 600;
    color: #111;
    line-height: 1.3;
    word-break: keep-all;
  }
  .rank-meta {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
  }
  .rank-db {
    font-size: 11px;
    font-weight: 700;
    color: #111;
  }
  .change-indicator {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 100px;
    display: inline-flex;
    align-items: center;
    gap: 1px;
  }
  .change-up { background: #dcfce7; color: #15803d; }
  .change-down { background: #fee2e2; color: #b91c1c; }
  .change-same { background: #f3f4f6; color: #9ca3af; }
  .change-new { background: #fef3c7; color: #d97706; }

  /* Below TOP 10 - 검색된 병원 표시 */
  .below-top10 {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #e5e7eb;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .below-top10-label {
    font-size: 10.5px;
    color: #9ca3af;
    font-weight: 600;
    margin-bottom: 2px;
    letter-spacing: 0.3px;
  }
  .below-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 7px;
    border-radius: 7px;
    background: #fffbeb;
    border: 1.5px solid #fde68a;
    font-size: 12px;
    flex-wrap: wrap;
  }
  .below-item .below-rank {
    flex-shrink: 0;
    background: #f59e0b;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 100px;
    white-space: nowrap;
  }
  .below-item .below-name {
    flex: 1;
    min-width: 0;
    font-size: 11.5px;
    font-weight: 700;
    color: #92400e;
    line-height: 1.3;
    word-break: keep-all;
  }
  .below-item .below-meta {
    flex-shrink: 0;
    font-size: 10px;
    color: #b45309;
    font-weight: 600;
    white-space: nowrap;
  }
  .below-item.not-found {
    background: #fafbfc;
    border-color: #e5e7eb;
  }
  .below-item.not-found .below-rank {
    background: #9ca3af;
    font-size: 9.5px;
    padding: 2px 7px;
  }
  .below-item.not-found .below-name {
    color: #6b7280;
  }
  .below-item.not-found .below-meta {
    color: #9ca3af;
    font-size: 9.5px;
  }
  .global-matrix-section {
    background: #fff;
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .matrix-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  .matrix-title { font-size: 16px; font-weight: 700; color: #111; }
  .matrix-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .matrix-card {
    border-radius: 12px;
    padding: 16px;
    border: 1.5px solid;
  }
  .matrix-card.champion { background: linear-gradient(135deg, #fffbeb, #fef3c7); border-color: #fcd34d; }
  .matrix-card.kr-only { background: linear-gradient(135deg, #f0f9ff, #e0f2fe); border-color: #7dd3fc; }
  .matrix-card.global-only { background: linear-gradient(135deg, #fdf4ff, #fae8ff); border-color: #d8b4fe; }

  .matrix-card-title {
    font-size: 13px;
    font-weight: 700;
    color: #111;
    margin-bottom: 4px;
  }
  .matrix-card-sub {
    font-size: 11px;
    color: #6b7280;
    margin-bottom: 12px;
  }
  .matrix-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .matrix-item {
    background: rgba(255,255,255,0.7);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .matrix-item:hover { background: rgba(255,255,255,1); transform: translateY(-1px); }
  .matrix-name { font-weight: 700; color: #111; }
  .matrix-meta { font-size: 10.5px; color: #6b7280; font-weight: 500; }
  .matrix-empty { color: #9ca3af; font-size: 11.5px; padding: 8px; text-align: center; }

  /* INSIGHT */
  .insight-section {
    background: #fff;
    border-radius: 16px;
    padding: 22px 26px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .insight-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
  }
  .insight-title { font-size: 15px; font-weight: 700; color: #111; }
  .download-btn {
    background: #fff;
    border: 1px solid #e5e7eb;
    color: #4b5563;
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .download-btn:hover { background: #FF5A1F; color: #fff; border-color: #FF5A1F; }
  .download-btn svg { width: 11px; height: 11px; }
  .insight-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .insight-card {
    border-radius: 10px;
    padding: 13px 15px;
    border-left: 3px solid;
  }
  .insight-card.up { background: #ecfdf5; border-color: #10b981; }
  .insight-card.down { background: #fef2f2; border-color: #ef4444; }
  .insight-card.new-entry { background: #fffbeb; border-color: #f59e0b; }
  .insight-card-label {
    font-size: 10.5px;
    font-weight: 700;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 7px;
  }
  .insight-item {
    font-size: 11.5px;
    color: #1a1a1a;
    line-height: 1.5;
    padding: 2px 0;
  }
  .insight-item strong { color: #111; font-weight: 700; }
  .insight-item .meta { color: #6b7280; font-size: 10.5px; }
  .insight-empty { color: #9ca3af; font-size: 11px; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal-content {
    background: #fff;
    border-radius: 18px;
    max-width: 880px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid #f0f1f3;
  }
  .modal-title {
    font-size: 20px;
    font-weight: 700;
    color: #111;
    margin-bottom: 4px;
  }
  .modal-sub {
    font-size: 12px;
    color: #6b7280;
  }
  .modal-close {
    background: #f3f4f6;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    color: #6b7280;
    flex-shrink: 0;
  }
  .modal-close:hover { background: #e5e7eb; }
  .modal-chart-wrap { position: relative; height: 320px; margin-bottom: 18px; }
  .modal-stats {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .modal-stat {
    background: #fafbfc;
    border: 1px solid #f0f1f3;
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
  }
  .modal-stat .flag { font-size: 20px; }
  .modal-stat .label { font-size: 10.5px; color: #6b7280; font-weight: 600; margin: 2px 0; }
  .modal-stat .value {
    font-size: 13px;
    font-weight: 700;
    color: #111;
  }
  .modal-stat .small { font-size: 10px; color: #9ca3af; }

  @media (max-width: 1280px) { .countries-grid:not(.cols-1):not(.cols-2):not(.cols-3) { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px) {
    .countries-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .matrix-grid, .insight-grid { grid-template-columns: 1fr; }
    .modal-stats { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div id="loading-screen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <div style="text-align:center">
    <div style="font-size:32px;margin-bottom:12px">🍑</div>
    <div style="color:#666;font-size:14px;font-weight:500">데이터 불러오는 중...</div>
  </div>
</div>
<div id="app-content" style="display:none">


<div class="container">

<header id="header-section">
  <h1>🍑 강남언니 TOP 병원 대시보드</h1>

    <span class="badge">🇹🇭 태국</span>

  <div class="modal-content">

      <div>
        <div class="modal-title" id="modalTitle">병원명</div>
        <div class="modal-sub" id="modalSub">17개월 6개국 트렌드</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-stats" id="modalStats"></div>

<script>
// 데이터는 loadAndInit()에서 data.json으로부터 fetch됩니다.
let RAW = null;
let MONTHS, DATA, TOTALS, ALL_HOSPITALS;
const COUNTRIES = ['한국', '일본', '중국', '태국', '대만', '미국'];

const COUNTRY_FLAGS = {
  '한국': '🇰🇷', '일본': '🇯🇵', '중국': '🇨🇳', '태국': '🇹🇭', '대만': '🇹🇼', '미국': '🇺🇸'
};

let isInternalMode = false;  // 외부용 기본
let currentPreset = 'single';
let currentSingleMonth = null;  // loadAndInit에서 최신 월로 할당
let activeCountries = new Set(COUNTRIES);
let selectedHospitals = new Set();
let chartInstance = null;

// === 모드 토글 ===
function toggleMode() {
  isInternalMode = document.getElementById('modeToggle').checked;
  document.getElementById('modeLabel').textContent = isInternalMode ? '내부용' : '외부용';
  render();
}

// === 프리셋 ===
function selectPreset(preset) {
  currentPreset = preset;
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.preset === preset);
  });
  document.getElementById('singleMonthWrap').style.display = (preset === 'single') ? 'flex' : 'none';
  document.getElementById('customRangeWrap').style.display = (preset === 'custom') ? 'flex' : 'none';
  render();
}

// === 기간 계산 ===
function getCurrentPeriod() {
  // returns { months: [...], label: '...', prevMonths: [...], prevLabel: '...' }
  if (currentPreset === 'single') {
    const m = document.getElementById('singleMonth').value;
    const idx = MONTHS.indexOf(m);
    const prev = idx > 0 ? [MONTHS[idx - 1]] : null;
    return {
      months: [m],
      label: m,
      prevMonths: prev,
      prevLabel: prev ? prev[0] : null
    };
  }
  if (currentPreset === 'last3') {
    // 마지막 완전한 월 기준 직전 3개월 (5월 제외)
    const endIdx = MONTHS.length - 2; // 4월
    const months = MONTHS.slice(endIdx - 2, endIdx + 1);
    const prevMonths = MONTHS.slice(endIdx - 5, endIdx - 2);
    return {
      months,
      label: `${months[0]} ~ ${months[months.length-1]} (3개월)`,
      prevMonths: prevMonths.length === 3 ? prevMonths : null,
      prevLabel: prevMonths.length === 3 ? `${prevMonths[0]}~${prevMonths[2]}` : null
    };
  }
  if (currentPreset === 'last6') {
    const endIdx = MONTHS.length - 2;
    const months = MONTHS.slice(endIdx - 5, endIdx + 1);
    const prevMonths = MONTHS.slice(endIdx - 11, endIdx - 5);
    return {
      months,
      label: `${months[0]} ~ ${months[months.length-1]} (6개월)`,
      prevMonths: prevMonths.length === 6 ? prevMonths : null,
      prevLabel: prevMonths.length === 6 ? `${prevMonths[0]}~${prevMonths[5]}` : null
    };
  }
  if (currentPreset === 'yoy') {
    const months2026 = MONTHS.filter(m => m.startsWith('26.'));
    const months2025 = MONTHS.filter(m => m.startsWith('25.')).slice(0, months2026.length);
    return {
      months: months2026,
      label: `2026년 (${months2026.length}개월) vs 2025년 동기`,
      prevMonths: months2025,
      prevLabel: `2025년 동기 ${months2025.length}개월`
    };
  }
  if (currentPreset === 'custom') {
    const start = document.getElementById('customStart').value;
    const end = document.getElementById('customEnd').value;
    const startIdx = MONTHS.indexOf(start);
    const endIdx = MONTHS.indexOf(end);
    if (startIdx === -1 || endIdx === -1 || startIdx > endIdx) return null;
    const months = MONTHS.slice(startIdx, endIdx + 1);
    return {
      months,
      label: `${start} ~ ${end} (${months.length}개월)`,
      prevMonths: null,
      prevLabel: null
    };
  }
}

// 기간 내 병원별 DB 합계
function aggregatePeriod(country, months) {
  const map = {};
  months.forEach(m => {
    const list = DATA[country][m] || [];
    list.forEach(h => {
      map[h.name] = (map[h.name] || 0) + h.db;
    });
  });
  const arr = Object.entries(map).map(([name, db]) => ({ name, db }));
  arr.sort((a, b) => b.db - a.db);
  return arr;
}

function getCountryTotal(country, months) {
  let sum = 0;
  months.forEach(m => { sum += (TOTALS[country][m] || 0); });
  return sum;
}

function getRankInPeriod(arr, hospitalName) {
  const idx = arr.findIndex(h => h.name === hospitalName);
  return idx === -1 ? null : idx + 1;
}

// === 렌더링 ===
function renderCountryCard(country, period) {
  const aggregated = aggregatePeriod(country, period.months);
  const top10 = aggregated.slice(0, 10);
  const flag = COUNTRY_FLAGS[country];
  const hasFilter = selectedHospitals.size > 0;
  
  const total = getCountryTotal(country, period.months);
  let totalHtml = '';
  if (isInternalMode) {
    const prevTotal = period.prevMonths ? getCountryTotal(country, period.prevMonths) : null;
    let changeHtml = '';
    if (prevTotal && prevTotal > 0) {
      const pct = ((total - prevTotal) / prevTotal) * 100;
      const cls = pct >= 0 ? 'up' : 'down';
      const sym = pct >= 0 ? '▲' : '▼';
      changeHtml = `<span class="total-change ${cls}">${sym}${Math.abs(pct).toFixed(1)}%</span>`;
    }
    totalHtml = `<div class="country-total">총 DB <span class="total-num">${total.toLocaleString()}</span>${changeHtml}</div>`;
  }

  // 전월 비교용 데이터
  let prevAggregated = null;
  if (document.getElementById('compareToggle').checked && period.prevMonths) {
    prevAggregated = aggregatePeriod(country, period.prevMonths);
  }

  let matchCount = 0;
  let itemsHtml = '';
  top10.forEach((hospital, idx) => {
    const rank = idx + 1;
    const isHL = selectedHospitals.has(hospital.name);
    if (isHL) matchCount++;

    let changeHtml = '';
    if (prevAggregated) {
      const prevRank = getRankInPeriod(prevAggregated, hospital.name);
      if (prevRank === null) {
        changeHtml = '<span class="change-indicator change-new">🆕</span>';
      } else if (prevRank > rank) {
        changeHtml = `<span class="change-indicator change-up">▲${prevRank - rank}</span>`;
      } else if (prevRank < rank) {
        changeHtml = `<span class="change-indicator change-down">▼${rank - prevRank}</span>`;
      } else {
        changeHtml = '<span class="change-indicator change-same">─</span>';
      }
    }

    let dbHtml = '';
    if (isInternalMode) {
      let dbChangeHtml = '';
      if (prevAggregated) {
        const prevHospital = prevAggregated.find(h => h.name === hospital.name);
        if (prevHospital && prevHospital.db > 0) {
          const pct = ((hospital.db - prevHospital.db) / prevHospital.db) * 100;
          const cls = pct >= 0 ? 'up' : 'down';
          const sym = pct >= 0 ? '▲' : '▼';
          dbChangeHtml = `<span class="change-indicator change-${pct >= 0 ? 'up' : 'down'}" style="margin-top:1px;">${sym}${Math.abs(pct).toFixed(0)}%</span>`;
        }
      }
      dbHtml = `<div class="rank-meta"><span class="rank-db">${hospital.db.toLocaleString()}</span>${dbChangeHtml}</div>`;
    } else if (changeHtml) {
      dbHtml = `<div class="rank-meta">${changeHtml}</div>`;
    }
    
    if (isInternalMode && changeHtml && !dbHtml.includes('change-indicator')) {
      // pass
    }

    const rankClass = rank <= 3 ? 'rank-num top3' : 'rank-num';
    const itemClass = isHL ? 'rank-item highlighted' : 'rank-item';
    const escName = hospital.name.replace(/'/g, "\\'");
    itemsHtml += `
      <div class="${itemClass}" onclick="openHospitalModal('${escName}')">
        <span class="${rankClass}">${rank}</span>
        <span class="rank-name">${hospital.name}</span>
        ${isInternalMode ? dbHtml : (changeHtml ? `<div class="rank-meta">${changeHtml}</div>` : '')}
      </div>
    `;
  });

  const matchBadge = (hasFilter && matchCount > 0) ? `<span class="match-badge">${matchCount}</span>` : '';
  const listClass = hasFilter ? 'ranking-list has-filter' : 'ranking-list';
  
  // TOP 10 밖 검색 병원 표시
  let belowTop10Html = '';
  if (hasFilter) {
    const top10Names = new Set(top10.map(h => h.name));
    const outsideHospitals = [];
    selectedHospitals.forEach(name => {
      if (!top10Names.has(name)) {
        // 전체에서 이 병원의 순위 찾기
        const rank = getRankInPeriod(aggregated, name);
        const found = aggregated.find(h => h.name === name);
        outsideHospitals.push({ name, rank, db: found ? found.db : null });
      }
    });
    
    if (outsideHospitals.length > 0) {
      const itemsBelowHtml = outsideHospitals.map(h => {
        const escName = h.name.replace(/'/g, "\\\\'");
        if (h.rank === null) {
          // 데이터 없음
          return `
            <div class="below-item not-found" onclick="openHospitalModal('${escName}')">
              <span class="below-rank">미진입</span>
              <span class="below-name">${h.name}</span>
            </div>
          `;
        }
        let metaHtml = '';
        if (isInternalMode && h.db) {
          metaHtml = `<span class="below-meta">DB ${h.db.toLocaleString()}</span>`;
        }
        return `
          <div class="below-item" onclick="openHospitalModal('${escName}')">
            <span class="below-rank">${h.rank}위</span>
            <span class="below-name">${h.name}</span>
            ${metaHtml}
          </div>
        `;
      }).join('');
      
      belowTop10Html = `
        <div class="below-top10">
          <div class="below-top10-label">📍 TOP 10 밖 검색 병원</div>
          ${itemsBelowHtml}
        </div>
      `;
    }
  }
  
  return `
    <div class="country-card">
      <div class="country-header">
        <span class="country-flag">${flag}</span>
        <span class="country-name">${country}</span>
        ${matchBadge}
        ${totalHtml}
      </div>
      <div class="${listClass}">${itemsHtml}</div>
      ${belowTop10Html}
    </div>
  `;
}

// === 글로벌 매트릭스 ===
function renderGlobalMatrix(period) {
  // 각 국가별 TOP10 추출
  const countryTop10 = {};
  COUNTRIES.forEach(c => {
    countryTop10[c] = aggregatePeriod(c, period.months).slice(0, 10).map(h => h.name);
  });

  // 1. 글로벌 챔피언: 4개국 이상에서 TOP 10
  const hospitalCountryCount = {};
  COUNTRIES.forEach(c => {
    countryTop10[c].forEach(name => {
      if (!hospitalCountryCount[name]) hospitalCountryCount[name] = [];
      hospitalCountryCount[name].push(c);
    });
  });
  const champions = Object.entries(hospitalCountryCount)
    .filter(([n, cs]) => cs.length >= 4)
    .sort((a, b) => b[1].length - a[1].length)
    .slice(0, 6);

  // 2. 한국 강자 / 글로벌 부진: 한국 TOP 5인데 다른 국가 TOP 10 0~1개
  const krTop5 = countryTop10['한국'].slice(0, 5);
  const krOnly = krTop5.map(name => {
    const others = (hospitalCountryCount[name] || []).filter(c => c !== '한국');
    return { name, otherCountries: others };
  }).filter(item => item.otherCountries.length <= 1);

  // 3. 글로벌 다크호스: 다른 국가에서 TOP 5인데 한국에서 TOP 10 안 든 병원
  const krTop10 = new Set(countryTop10['한국']);
  const darkHorses = [];
  COUNTRIES.filter(c => c !== '한국').forEach(c => {
    countryTop10[c].slice(0, 5).forEach((name, idx) => {
      if (!krTop10.has(name)) {
        const existing = darkHorses.find(d => d.name === name);
        if (existing) {
          existing.countries.push({ country: c, rank: idx + 1 });
        } else {
          darkHorses.push({ name, countries: [{ country: c, rank: idx + 1 }] });
        }
      }
    });
  });
  darkHorses.sort((a, b) => b.countries.length - a.countries.length);

  // 렌더링
  const renderItems = (items, type) => {
    if (items.length === 0) return '<div class="matrix-empty">해당 병원 없음</div>';
    return items.slice(0, 6).map(item => {
      let meta = '';
      let name = '';
      if (type === 'champion') {
        name = item[0];
        const flags = item[1].map(c => COUNTRY_FLAGS[c]).join(' ');
        meta = `${flags} ${item[1].length}개국`;
      } else if (type === 'kr-only') {
        name = item.name;
        const others = item.otherCountries.map(c => COUNTRY_FLAGS[c]).join('');
        meta = others ? `해외: ${others}만 진입` : '🇰🇷 한국에서만';
      } else {
        name = item.name;
        const flagsAndRanks = item.countries.map(c => `${COUNTRY_FLAGS[c.country]} ${c.rank}위`).join(', ');
        meta = flagsAndRanks;
      }
      const escName = name.replace(/'/g, "\\'");
      return `<div class="matrix-item" onclick="openHospitalModal('${escName}')"><span class="matrix-name">${name}</span><span class="matrix-meta">${meta}</span></div>`;
    }).join('');
  };

  document.getElementById('matrix-grid').innerHTML = `
    <div class="matrix-card champion">
      <div class="matrix-card-title">🏆 글로벌 챔피언</div>
      <div class="matrix-card-sub">4개국 이상에서 TOP 10 진입</div>
      <div class="matrix-list">${renderItems(champions, 'champion')}</div>
    </div>
    <div class="matrix-card kr-only">
      <div class="matrix-card-title">🇰🇷 한국 강자 · 글로벌 도약 여지</div>
      <div class="matrix-card-sub">한국 TOP 5, 해외 1개국 이하 진입</div>
      <div class="matrix-list">${renderItems(krOnly, 'kr-only')}</div>
    </div>
    <div class="matrix-card global-only">
      <div class="matrix-card-title">🌍 글로벌 다크호스</div>
      <div class="matrix-card-sub">해외 TOP 5, 한국 TOP 10 밖</div>
      <div class="matrix-list">${renderItems(darkHorses, 'global-only')}</div>
    </div>
  `;
}

// === 인사이트 ===
function renderInsights(period) {
  if (!period.prevMonths || !document.getElementById('compareToggle').checked) {
    document.getElementById('insight-grid').innerHTML = `<div class="insight-empty" style="grid-column: 1 / -1; text-align: center; padding: 20px;">전월/전기간 대비 비교가 불가능한 기간입니다.</div>`;
    return;
  }

  const allChanges = [];
  COUNTRIES.forEach(country => {
    if (!activeCountries.has(country)) return;
    const current = aggregatePeriod(country, period.months);
    const prev = aggregatePeriod(country, period.prevMonths);
    current.slice(0, 10).forEach((h, idx) => {
      const rank = idx + 1;
      const prevRank = getRankInPeriod(prev, h.name);
      if (prevRank === null) {
        allChanges.push({ country, name: h.name, rank, type: 'new' });
      } else {
        const diff = prevRank - rank;
        if (diff > 0) allChanges.push({ country, name: h.name, rank, prevRank, diff, type: 'up' });
        else if (diff < 0) allChanges.push({ country, name: h.name, rank, prevRank, diff: Math.abs(diff), type: 'down' });
      }
    });
  });

  const ups = allChanges.filter(c => c.type === 'up').sort((a, b) => b.diff - a.diff).slice(0, 6);
  const downs = allChanges.filter(c => c.type === 'down').sort((a, b) => b.diff - a.diff).slice(0, 6);
  const news = allChanges.filter(c => c.type === 'new').slice(0, 6);

  const renderList = (items, empty) => {
    if (items.length === 0) return `<div class="insight-empty">${empty}</div>`;
    return items.map(i => {
      const flag = COUNTRY_FLAGS[i.country];
      if (i.type === 'new') return `<div class="insight-item">${flag} <strong>${i.name}</strong> <span class="meta">→ ${i.rank}위 신규</span></div>`;
      const arrow = i.type === 'up' ? '▲' : '▼';
      return `<div class="insight-item">${flag} <strong>${i.name}</strong> <span class="meta">${i.prevRank}위 → ${i.rank}위 (${arrow}${i.diff})</span></div>`;
    }).join('');
  };

  document.getElementById('insight-grid').innerHTML = `
    <div class="insight-card up">
      <div class="insight-card-label">🚀 가장 큰 상승</div>
      ${renderList(ups, '상승 병원 없음')}
    </div>
    <div class="insight-card new-entry">
      <div class="insight-card-label">🆕 TOP 10 신규 진입</div>
      ${renderList(news, '신규 진입 없음')}
    </div>
    <div class="insight-card down">
      <div class="insight-card-label">📉 가장 큰 하락</div>
      ${renderList(downs, '하락 병원 없음')}
    </div>
  `;
}

function render() {
  const period = getCurrentPeriod();
  if (!period) {
    document.getElementById('periodDisplay').textContent = '기간 오류';
    return;
  }
  document.getElementById('periodDisplay').textContent = period.label;

  const grid = document.getElementById('countries-section');
  const visibleCountries = COUNTRIES.filter(c => activeCountries.has(c));
  grid.className = `countries-grid cols-${visibleCountries.length}`;
  grid.innerHTML = visibleCountries.map(c => renderCountryCard(c, period)).join('');

  const title = document.getElementById('insight-title');
  if (period.prevLabel) {
    title.textContent = `💡 인사이트 — ${period.prevLabel} 대비 변화`;
  } else {
    title.textContent = `💡 인사이트`;
  }

  renderGlobalMatrix(period);
  renderInsights(period);
  renderChips();
}

// === 국가 토글 ===
function toggleCountry(country) {
  if (activeCountries.has(country)) {
    if (activeCountries.size > 1) activeCountries.delete(country);
  } else {
    activeCountries.add(country);
  }
  renderCountryToggles();
  render();
}
function renderCountryToggles() {
  document.getElementById('countryToggles').innerHTML = COUNTRIES.map(c => {
    const active = activeCountries.has(c) ? 'active' : '';
    return `<button class="country-toggle ${active}" onclick="toggleCountry('${c}')">${COUNTRY_FLAGS[c]} ${c}</button>`;
  }).join('');
}

// === 검색 / chip ===
function renderChips() {
  const c = document.getElementById('selectedChips');
  if (selectedHospitals.size === 0) {
    c.innerHTML = '<span class="chips-label">🔖 하이라이트:</span><span class="chips-empty">병원 검색하여 추가</span>';
    return;
  }
  const chips = Array.from(selectedHospitals).map(n =>
    `<span class="chip">${n}<button class="chip-remove" onclick="removeHospital('${n.replace(/'/g, "\\'")}')">×</button></span>`
  ).join('');
  c.innerHTML = `<span class="chips-label">🔖 하이라이트 (${selectedHospitals.size}):</span>${chips}<button class="clear-all-btn" onclick="clearAll()">전체 해제</button>`;
}
function addHospital(name) { selectedHospitals.add(name); document.getElementById('hospitalSearch').value = ''; hideAuto(); render(); }
function removeHospital(name) { selectedHospitals.delete(name); render(); }
function clearAll() { selectedHospitals.clear(); render(); }

function showAuto(q) {
  const dd = document.getElementById('autocompleteDropdown');
  const lq = q.trim().toLowerCase();
  const matches = lq === '' ? ALL_HOSPITALS.slice(0, 20) : ALL_HOSPITALS.filter(h => h.toLowerCase().includes(lq)).slice(0, 20);
  if (matches.length === 0) {
    dd.innerHTML = `<div style="padding:14px; text-align:center; color:#9ca3af; font-size:12px;">매칭 병원 없음</div>`;
    dd.classList.add('show'); return;
  }
  dd.innerHTML = matches.map(n => {
    const sel = selectedHospitals.has(n);
    const check = sel ? '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '';
    return `<div class="autocomplete-item ${sel ? 'selected' : ''}" data-name="${n}">${check}<span>${n}</span></div>`;
  }).join('');
  dd.querySelectorAll('.autocomplete-item').forEach(item => {
    item.addEventListener('click', () => {
      const n = item.dataset.name;
      if (selectedHospitals.has(n)) { removeHospital(n); showAuto(document.getElementById('hospitalSearch').value); }
      else addHospital(n);
    });
  });
  dd.classList.add('show');
}
function hideAuto() { setTimeout(() => document.getElementById('autocompleteDropdown').classList.remove('show'), 150); }

document.getElementById('hospitalSearch').addEventListener('input', e => showAuto(e.target.value));
document.getElementById('hospitalSearch').addEventListener('focus', e => showAuto(e.target.value));
document.getElementById('hospitalSearch').addEventListener('blur', hideAuto);

// === 모달 ===
function openHospitalModal(name) {
  document.getElementById('modalTitle').textContent = name;
  document.getElementById('modalSub').textContent = `${MONTHS[0]} ~ ${MONTHS[MONTHS.length-1]} (17개월) · 6개국 트렌드`;

  // 6개국 통계
  const stats = COUNTRIES.map(c => {
    let totalDb = 0;
    let peakRank = null;
    let peakMonth = null;
    MONTHS.forEach(m => {
      const list = DATA[c][m] || [];
      const found = list.find(h => h.name === name);
      if (found) {
        totalDb += found.db;
        const rank = list.findIndex(h => h.name === name) + 1;
        if (peakRank === null || rank < peakRank) {
          peakRank = rank;
          peakMonth = m;
        }
      }
    });
    return { country: c, totalDb, peakRank, peakMonth };
  });

  const statsHtml = stats.map(s => {
    const peak = s.peakRank ? `최고 ${s.peakRank}위` : '진입 ❌';
    const total = s.totalDb > 0 ? s.totalDb.toLocaleString() : '-';
    return `
      <div class="modal-stat">
        <div class="flag">${COUNTRY_FLAGS[s.country]}</div>
        <div class="label">${s.country}</div>
        <div class="value">${peak}</div>
        <div class="small">누적 DB: ${total}</div>
      </div>
    `;
  }).join('');
  document.getElementById('modalStats').innerHTML = statsHtml;

  // 차트
  const datasets = COUNTRIES.map(c => {
    const data = MONTHS.map(m => {
      const list = DATA[c][m] || [];
      const found = list.find(h => h.name === name);
      return found ? found.db : null;
    });
    return {
      label: `${COUNTRY_FLAGS[c]} ${c}`,
      data,
      borderColor: { '한국':'#0EA5E9', '일본':'#EC4899', '중국':'#F59E0B', '태국':'#10B981', '대만':'#8B5CF6', '미국':'#EF4444' }[c],
      backgroundColor: 'transparent',
      tension: 0.3,
      borderWidth: 2.5,
      pointRadius: 3,
      spanGaps: true,
    };
  });

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('modalChart'), {
    type: 'line',
    data: { labels: MONTHS, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { font: { size: 11 }, padding: 8, boxWidth: 12 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y ? c.parsed.y.toLocaleString() + ' DB' : '-'}` } }
      },
      scales: {
        y: { beginAtZero: true, ticks: { font: { size: 10 }, callback: v => v.toLocaleString() } },
        x: { ticks: { font: { size: 10 }, maxRotation: 45 } }
      }
    }
  });

  document.getElementById('hospitalModal').classList.add('show');
}
function closeModal() { document.getElementById('hospitalModal').classList.remove('show'); }

// === 다운로드 ===
async function downloadSection(id, name) {
  const el = document.getElementById(id);
  if (!el) return;
  try {
    const canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 2, useCORS: true, logging: false });
    const link = document.createElement('a');
    link.download = `${name}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) { console.error(err); }
}
async function downloadAll() {
  const c = document.querySelector('.container');
  document.querySelectorAll('.download-btn, .header-download-btn').forEach(b => b.style.visibility = 'hidden');
  try {
    const canvas = await html2canvas(c, { backgroundColor: '#f5f6f8', scale: 2, useCORS: true, logging: false });
    const link = document.createElement('a');
    link.download = `글로벌_대시보드.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) { console.error(err); }
  finally { document.querySelectorAll('.download-btn, .header-download-btn').forEach(b => b.style.visibility = 'visible'); }
}

// === 초기화 ===
function init() {
  // 월 선택기 채우기
  const singleSel = document.getElementById('singleMonth');
  const startSel = document.getElementById('customStart');
  const endSel = document.getElementById('customEnd');
  MONTHS.forEach(m => {
    [singleSel, startSel, endSel].forEach(sel => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      sel.appendChild(opt);
    });
  });
  // 기본: 5월은 부분 데이터라 4월
  singleSel.value = MONTHS[MONTHS.length - 2];
  startSel.value = MONTHS[MONTHS.length - 4];
  endSel.value = MONTHS[MONTHS.length - 2];

  renderCountryToggles();
  render();
}

async function loadAndInit() {
  try {
    const res = await fetch('./data.json?v=' + Date.now());
    if (!res.ok) throw new Error('data.json 로드 실패: ' + res.status);
    RAW = await res.json();
    MONTHS = RAW.months;
    DATA = RAW.data;
    TOTALS = RAW.totals;
    ALL_HOSPITALS = RAW.hospitals;
    // 기본 월: 최신월 (전월 대비 % 계산 가능한 가장 최근 월)
    currentSingleMonth = MONTHS[MONTHS.length - 1];
    // 로딩 UI 숨기고 앱 초기화
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app-content').style.display = '';
    init();
  } catch (e) {
    console.error(e);
    document.getElementById('loading-screen').innerHTML = 
      '<div style="color:#c00;text-align:center;padding:2rem"><strong>데이터를 불러오지 못했어요</strong><br><br>' +
      '<span style="font-size:13px;color:#666">' + e.message + '</span><br><br>' +
      '<span style="font-size:12px;color:#999">data.json 파일이 같은 폴더에 있는지 확인해주세요.</span></div>';
  }
}
loadAndInit();
</script>
