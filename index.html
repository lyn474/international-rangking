<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>국가별 월별 병원 TOP 10 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    line-height: 1.6;
    padding: 32px 16px;
  }
  .container { max-width: 1380px; margin: 0 auto; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0EA5E9 0%, #4F46E5 100%);
    color: #fff;
    padding: 36px 40px;
    border-radius: 20px;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(14, 165, 233, 0.18);
    position: relative;
  }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  header .subtitle {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 18px;
  }
  header .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  header .badge {
    background: rgba(255,255,255,0.2);
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
  }
  .header-download-btn {
    position: absolute;
    top: 28px;
    right: 28px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .header-download-btn:hover {
    background: rgba(255,255,255,0.25);
  }
  .header-download-btn svg { width: 14px; height: 14px; }

  /* CONTROL PANEL */
  .control-panel {
    background: #fff;
    border-radius: 16px;
    padding: 22px 28px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .control-row + .control-row {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #f0f1f3;
  }
  .selector-label {
    font-size: 13px;
    color: #6b7280;
    font-weight: 600;
  }
  .month-buttons {
    display: flex;
    gap: 6px;
    background: #f3f4f6;
    padding: 5px;
    border-radius: 12px;
  }
  .month-btn {
    background: transparent;
    border: none;
    padding: 9px 22px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: #6b7280;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .month-btn:hover { color: #111; }
  .month-btn.active {
    background: linear-gradient(135deg, #0EA5E9, #4F46E5);
    color: #fff;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
  }
  .compare-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: #4b5563;
  }

  /* SEARCH FILTER */
  .search-wrapper {
    flex: 1;
    min-width: 280px;
    position: relative;
  }
  .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    background: #f9fafb;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    padding: 0 12px;
    transition: all 0.15s ease;
  }
  .search-input-wrap:focus-within {
    border-color: #0EA5E9;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
  }
  .search-icon {
    width: 16px;
    height: 16px;
    color: #9ca3af;
    flex-shrink: 0;
  }
  #hospitalSearch {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 8px;
    font-size: 13px;
    outline: none;
    color: #111;
    font-family: inherit;
  }
  #hospitalSearch::placeholder { color: #9ca3af; }

  .autocomplete-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    max-height: 240px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }
  .autocomplete-dropdown.show { display: block; }
  .autocomplete-item {
    padding: 10px 14px;
    font-size: 12.5px;
    cursor: pointer;
    border-bottom: 1px solid #f5f6f8;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover, .autocomplete-item.highlighted {
    background: #f0f9ff;
    color: #0369a1;
  }
  .autocomplete-item.selected {
    background: #ecfeff;
    color: #0e7490;
    font-weight: 600;
  }
  .autocomplete-item .check {
    width: 14px;
    height: 14px;
    color: #0EA5E9;
  }
  .autocomplete-empty {
    padding: 16px;
    text-align: center;
    color: #9ca3af;
    font-size: 12px;
  }

  /* SELECTED CHIPS */
  .selected-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    flex: 1;
  }
  .chips-label {
    font-size: 12px;
    color: #6b7280;
    font-weight: 600;
    margin-right: 4px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: linear-gradient(135deg, #0EA5E9, #4F46E5);
    color: #fff;
    padding: 5px 8px 5px 12px;
    border-radius: 100px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .chip-remove {
    background: rgba(255,255,255,0.25);
    border: none;
    color: #fff;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    font-family: inherit;
  }
  .chip-remove:hover { background: rgba(255,255,255,0.4); }
  .clear-all-btn {
    background: transparent;
    border: 1px solid #e5e7eb;
    color: #6b7280;
    padding: 5px 12px;
    border-radius: 100px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 4px;
  }
  .clear-all-btn:hover {
    background: #fef2f2;
    color: #dc2626;
    border-color: #fca5a5;
  }
  .chips-empty {
    font-size: 12px;
    color: #9ca3af;
    font-style: italic;
  }

  /* MAIN GRID */
  .countries-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  .country-card {
    background: #fff;
    border-radius: 16px;
    padding: 20px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .country-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 2px solid #f0f1f3;
  }
  .country-flag { font-size: 24px; }
  .country-name {
    font-size: 16px;
    font-weight: 700;
    color: #111;
  }
  .match-badge {
    margin-left: auto;
    background: #fef3c7;
    color: #d97706;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 100px;
  }
  .ranking-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .rank-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-radius: 8px;
    font-size: 12px;
    background: #fafbfc;
    border: 1.5px solid transparent;
    transition: all 0.3s ease;
  }
  .rank-item:hover { background: #f3f4f6; }
  .rank-item.highlighted {
    background: linear-gradient(135deg, #fef3c7, #fed7aa);
    border-color: #f59e0b;
    box-shadow: 0 2px 8px rgba(245, 158, 11, 0.2);
    transform: translateY(-1px);
  }
  .rank-item.highlighted .rank-name {
    color: #92400e;
    font-weight: 700;
  }
  /* 검색어가 있을 때 매칭 안된 아이템은 흐리게 */
  .ranking-list.has-filter .rank-item:not(.highlighted) {
    opacity: 0.35;
  }
  .rank-num {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: #f3f4f6;
    color: #6b7280;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rank-num.top3 {
    background: linear-gradient(135deg, #0EA5E9, #4F46E5);
    color: #fff;
  }
  .rank-item.highlighted .rank-num {
    background: #f59e0b;
    color: #fff;
  }
  .rank-name {
    flex: 1;
    font-size: 11.5px;
    font-weight: 600;
    color: #111;
    line-height: 1.35;
    word-break: keep-all;
  }
  .change-indicator {
    flex-shrink: 0;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 100px;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    min-width: 38px;
    justify-content: center;
  }
  .change-up { background: #dcfce7; color: #15803d; }
  .change-down { background: #fee2e2; color: #b91c1c; }
  .change-same { background: #f3f4f6; color: #9ca3af; }
  .change-new { background: #fef3c7; color: #d97706; }

  /* INSIGHT SECTION */
  .insight-section {
    background: #fff;
    border-radius: 16px;
    padding: 24px 28px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .insight-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .insight-title {
    font-size: 16px;
    font-weight: 700;
    color: #111;
  }
  .download-btn {
    background: #fff;
    border: 1px solid #e5e7eb;
    color: #4b5563;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .download-btn:hover {
    background: #0EA5E9;
    color: #fff;
    border-color: #0EA5E9;
  }
  .download-btn svg { width: 12px; height: 12px; }

  .insight-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .insight-card {
    border-radius: 10px;
    padding: 14px 16px;
    border-left: 3px solid;
  }
  .insight-card.up { background: #ecfdf5; border-color: #10b981; }
  .insight-card.down { background: #fef2f2; border-color: #ef4444; }
  .insight-card.new-entry { background: #fffbeb; border-color: #f59e0b; }
  .insight-card-label {
    font-size: 11px;
    font-weight: 700;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
  }
  .insight-card-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .insight-item {
    font-size: 12px;
    color: #1a1a1a;
    line-height: 1.5;
  }
  .insight-item strong { color: #111; font-weight: 700; }
  .insight-item .meta { color: #6b7280; font-size: 11px; }
  .insight-empty { color: #9ca3af; font-size: 11.5px; }

  .compare-banner {
    background: #f0f9ff;
    border: 1px dashed #bae6fd;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 12px;
    color: #075985;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  @media (max-width: 1100px) {
    .countries-grid { grid-template-columns: repeat(2, 1fr); }
    .insight-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- PASSWORD LOCK SCREEN -->
<div id="lockScreen" style="position: fixed; inset: 0; background: linear-gradient(135deg, #0EA5E9 0%, #4F46E5 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div style="background: #fff; border-radius: 20px; padding: 48px 40px; max-width: 380px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;">
    <div style="font-size: 48px; margin-bottom: 16px;">🔒</div>
    <h2 style="font-size: 20px; font-weight: 700; color: #111; margin-bottom: 8px; letter-spacing: -0.3px;">대시보드 접근</h2>
    <p style="font-size: 13px; color: #6b7280; margin-bottom: 24px;">접근 비밀번호를 입력해주세요</p>
    <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="off"
      style="width: 100%; padding: 14px 16px; font-size: 15px; border: 1.5px solid #e5e7eb; border-radius: 10px; outline: none; text-align: center; letter-spacing: 8px; font-family: inherit; transition: all 0.15s ease;"
      onfocus="this.style.borderColor='#0EA5E9'; this.style.boxShadow='0 0 0 3px rgba(14, 165, 233, 0.1)';"
      onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none';"
      onkeydown="if(event.key==='Enter') checkPassword()">
    <div id="pwError" style="font-size: 12px; color: #dc2626; margin-top: 10px; min-height: 18px; font-weight: 600;"></div>
    <button onclick="checkPassword()" style="width: 100%; margin-top: 14px; padding: 13px; background: linear-gradient(135deg, #0EA5E9, #4F46E5); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: transform 0.15s ease;"
      onmouseover="this.style.transform='translateY(-1px)'"
      onmouseout="this.style.transform='translateY(0)'">
      접속하기
    </button>
  </div>
</div>

<script>
  // 비밀번호 체크
  const CORRECT_PW = '0401';
  function checkPassword() {
    const input = document.getElementById('pwInput');
    const errorEl = document.getElementById('pwError');
    if (input.value === CORRECT_PW) {
      document.getElementById('lockScreen').style.opacity = '0';
      document.getElementById('lockScreen').style.transition = 'opacity 0.3s ease';
      setTimeout(() => {
        document.getElementById('lockScreen').style.display = 'none';
      }, 300);
      // 세션 동안 기억 (탭 닫으면 다시 입력)
      sessionStorage.setItem('dashboardAuth', 'ok');
    } else {
      errorEl.textContent = '비밀번호가 올바르지 않습니다';
      input.value = '';
      input.style.borderColor = '#dc2626';
      input.style.animation = 'shake 0.3s ease';
      setTimeout(() => {
        input.style.animation = '';
        input.style.borderColor = '#e5e7eb';
      }, 300);
    }
  }

  // 이미 인증된 세션이면 바로 통과
  if (sessionStorage.getItem('dashboardAuth') === 'ok') {
    document.getElementById('lockScreen').style.display = 'none';
  } else {
    // 입력창에 자동 포커스
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
  }
</script>

<style>
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>

        changeHtml = '<span class="change-indicator change-new">🆕</span>';
      } else if (prevRank > rank) {
        changeHtml = `<span class="change-indicator change-up">▲${prevRank - rank}</span>`;
      } else if (prevRank < rank) {
        changeHtml = `<span class="change-indicator change-down">▼${rank - prevRank}</span>`;
      } else {
        changeHtml = '<span class="change-indicator change-same">─</span>';
      }
    }

    const rankClass = rank <= 3 ? 'rank-num top3' : 'rank-num';
    const itemClass = isHighlighted ? 'rank-item highlighted' : 'rank-item';
    itemsHtml += `
      <div class="${itemClass}">
        <span class="${rankClass}">${rank}</span>
        <span class="rank-name">${hospital.name}</span>
        ${changeHtml}
      </div>
    `;
  });

  const matchBadge = (hasFilter && matchCount > 0)
    ? `<span class="match-badge">${matchCount}개 매칭</span>` : '';

  const listClass = hasFilter ? 'ranking-list has-filter' : 'ranking-list';
  return `
    <div class="country-card">
      <div class="country-header">
        <span class="country-flag">${flag}</span>
        <span class="country-name">${country}</span>
        ${matchBadge}
      </div>
      <div class="${listClass}">${itemsHtml}</div>
    </div>
  `;
}

function renderInsights(monthKey, compareKey) {
  const allChanges = [];
  Object.keys(DATA).forEach(country => {
    const top10 = (DATA[country][monthKey] || []).slice(0, 10);
    top10.forEach((h, idx) => {
      const rank = idx + 1;
      const prevRank = compareKey ? getRankInMonth(country, compareKey, h.name) : null;
      if (prevRank === null && compareKey) {
        allChanges.push({ country, name: h.name, rank, prevRank: null, diff: null, type: 'new' });
      } else if (prevRank !== null) {
        const diff = prevRank - rank;
        if (diff > 0) allChanges.push({ country, name: h.name, rank, prevRank, diff, type: 'up' });
        else if (diff < 0) allChanges.push({ country, name: h.name, rank, prevRank, diff: Math.abs(diff), type: 'down' });
      }
    });
  });

  const ups = allChanges.filter(c => c.type === 'up').sort((a,b) => b.diff - a.diff).slice(0, 6);
  const downs = allChanges.filter(c => c.type === 'down').sort((a,b) => b.diff - a.diff).slice(0, 6);
  const news = allChanges.filter(c => c.type === 'new').slice(0, 6);

  const renderList = (items, emptyText) => {
    if (items.length === 0) return `<div class="insight-empty">${emptyText}</div>`;
    return items.map(item => {
      const flag = COUNTRY_FLAGS[item.country];
      if (item.type === 'new') {
        return `<div class="insight-item">${flag} <strong>${item.name}</strong> <span class="meta">→ ${item.rank}위 신규 진입</span></div>`;
      }
      const arrow = item.type === 'up' ? '▲' : '▼';
      return `<div class="insight-item">${flag} <strong>${item.name}</strong> <span class="meta">${item.prevRank}위 → ${item.rank}위 (${arrow}${item.diff})</span></div>`;
    }).join('');
  };

  const html = `
    <div class="insight-card up">
      <div class="insight-card-label">🚀 가장 큰 상승</div>
      <div class="insight-card-list">${renderList(ups, '상승 병원 없음')}</div>
    </div>
    <div class="insight-card new-entry">
      <div class="insight-card-label">🆕 TOP 10 신규 진입</div>
      <div class="insight-card-list">${renderList(news, '신규 진입 병원 없음')}</div>
    </div>
    <div class="insight-card down">
      <div class="insight-card-label">📉 가장 큰 하락</div>
      <div class="insight-card-list">${renderList(downs, '하락 병원 없음')}</div>
    </div>
  `;
  document.getElementById('insight-grid').innerHTML = html;
}

function render() {
  const compareEnabled = document.getElementById('compareToggle').checked;
  const compareKey = compareEnabled ? PREV_MONTH[currentMonth] : null;

  const grid = document.getElementById('countries-section');
  grid.innerHTML = Object.keys(DATA).map(c => renderCountryCard(c, currentMonth, compareKey)).join('');

  const title = document.getElementById('insight-title');
  const banner = document.getElementById('compare-banner');
  if (compareKey) {
    title.textContent = `💡 ${MONTH_LABELS[currentMonth]} 인사이트 — ${MONTH_LABELS[compareKey]} 대비 변화`;
    banner.style.display = 'flex';
    renderInsights(currentMonth, compareKey);
  } else if (currentMonth === 'm1') {
    title.textContent = `💡 ${MONTH_LABELS[currentMonth]} 인사이트 — 첫 달 (비교 대상 없음)`;
    banner.style.display = 'none';
    document.getElementById('insight-grid').innerHTML = `<div class="insight-empty" style="grid-column: 1 / -1; text-align: center; padding: 20px;">첫 달이므로 전월 대비 비교 데이터가 없습니다.</div>`;
  } else {
    title.textContent = `💡 ${MONTH_LABELS[currentMonth]} 인사이트`;
    banner.style.display = 'none';
    document.getElementById('insight-grid').innerHTML = `<div class="insight-empty" style="grid-column: 1 / -1; text-align: center; padding: 20px;">"전월 대비 순위 변동 표시" 옵션을 켜면 인사이트가 표시됩니다.</div>`;
  }

  renderChips();
}

// === SEARCH & FILTER ===
function renderChips() {
  const chipsContainer = document.getElementById('selectedChips');
  if (selectedHospitals.size === 0) {
    chipsContainer.innerHTML = '<span class="chips-label">🔖 하이라이트:</span><span class="chips-empty">검색해서 병원을 추가하면 5개국 TOP 10에서 하이라이트됩니다</span>';
    return;
  }
  const chips = Array.from(selectedHospitals).map(name =>
    `<span class="chip">${name}<button class="chip-remove" onclick="removeHospital('${name.replace(/'/g, "\\'")}')">×</button></span>`
  ).join('');
  chipsContainer.innerHTML = `<span class="chips-label">🔖 하이라이트 (${selectedHospitals.size}):</span>${chips}<button class="clear-all-btn" onclick="clearAllHospitals()">전체 해제</button>`;
}

function addHospital(name) {
  selectedHospitals.add(name);
  document.getElementById('hospitalSearch').value = '';
  hideAutocomplete();
  render();
}

function removeHospital(name) {
  selectedHospitals.delete(name);
  render();
}

function clearAllHospitals() {
  selectedHospitals.clear();
  render();
}

function showAutocomplete(query) {
  const dropdown = document.getElementById('autocompleteDropdown');
  const q = query.trim().toLowerCase();

  let matches;
  if (q === '') {
    matches = ALL_HOSPITALS.slice(0, 20);
  } else {
    matches = ALL_HOSPITALS.filter(h => h.toLowerCase().includes(q)).slice(0, 20);
  }

  if (matches.length === 0) {
    dropdown.innerHTML = `<div class="autocomplete-empty">"${query}"에 해당하는 병원이 없습니다</div>`;
    dropdown.classList.add('show');
    return;
  }

  highlightedAutocompleteIdx = -1;
  dropdown.innerHTML = matches.map((name, idx) => {
    const isSelected = selectedHospitals.has(name);
    const check = isSelected ? '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '';
    return `<div class="autocomplete-item ${isSelected ? 'selected' : ''}" data-name="${name}" data-idx="${idx}">${check}<span>${name}</span></div>`;
  }).join('');

  dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
    item.addEventListener('click', () => {
      const name = item.dataset.name;
      if (selectedHospitals.has(name)) {
        removeHospital(name);
        // 검색창 상태 유지
        const q = document.getElementById('hospitalSearch').value;
        showAutocomplete(q);
      } else {
        addHospital(name);
      }
    });
  });
  dropdown.classList.add('show');
}

function hideAutocomplete() {
  setTimeout(() => {
    document.getElementById('autocompleteDropdown').classList.remove('show');
  }, 150);
}

document.getElementById('hospitalSearch').addEventListener('input', (e) => {
  showAutocomplete(e.target.value);
});
document.getElementById('hospitalSearch').addEventListener('focus', (e) => {
  showAutocomplete(e.target.value);
});
document.getElementById('hospitalSearch').addEventListener('blur', hideAutocomplete);

// 키보드 네비게이션
document.getElementById('hospitalSearch').addEventListener('keydown', (e) => {
  const dropdown = document.getElementById('autocompleteDropdown');
  const items = dropdown.querySelectorAll('.autocomplete-item');
  if (items.length === 0) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightedAutocompleteIdx = Math.min(highlightedAutocompleteIdx + 1, items.length - 1);
    updateAutocompleteHighlight(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightedAutocompleteIdx = Math.max(highlightedAutocompleteIdx - 1, 0);
    updateAutocompleteHighlight(items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (highlightedAutocompleteIdx >= 0 && items[highlightedAutocompleteIdx]) {
      items[highlightedAutocompleteIdx].click();
    }
  } else if (e.key === 'Escape') {
    hideAutocomplete();
    e.target.blur();
  }
});

function updateAutocompleteHighlight(items) {
  items.forEach((item, idx) => {
    item.classList.toggle('highlighted', idx === highlightedAutocompleteIdx);
  });
  if (highlightedAutocompleteIdx >= 0) {
    items[highlightedAutocompleteIdx].scrollIntoView({ block: 'nearest' });
  }
}

// === 다운로드 ===
async function downloadSection(sectionId, fileName) {
  const element = document.getElementById(sectionId);
  if (!element) return;
  try {
    const canvas = await html2canvas(element, {
      backgroundColor: '#ffffff', scale: 2, useCORS: true, logging: false,
    });
    const link = document.createElement('a');
    link.download = `${fileName}_${MONTH_LABELS[currentMonth]}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) { console.error(err); }
}

async function downloadAll() {
  const container = document.querySelector('.container');
  document.querySelectorAll('.download-btn, .header-download-btn').forEach(btn => btn.style.visibility = 'hidden');
  try {
    const canvas = await html2canvas(container, {
      backgroundColor: '#f5f6f8', scale: 2, useCORS: true, logging: false,
    });
    const link = document.createElement('a');
    link.download = `국가별_대시보드_${MONTH_LABELS[currentMonth]}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) { console.error(err); }
  finally {
    document.querySelectorAll('.download-btn, .header-download-btn').forEach(btn => btn.style.visibility = 'visible');
  }
}

// 초기 렌더
render();
</script>
